<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const C={bg:'#131722',grid:'#363A45',tx:'#B2B5BE',up:'#0ECB81',dn:'#F6465D',wick:'#787B86',sep:'#2A2E39',bl:'#2962FF'};
const SY={'XAUUSD.vx':{n:'Gold vs US Dollar',p:4182.24,v:.0004,d:2,sp:.29,cs:100},'EURUSD':{n:'Euro vs US Dollar',p:1.0852,v:.00018,d:5,sp:.00012,cs:1e5},'GBPUSD':{n:'Great Britain Pound vs US Dollar',p:1.294,v:.0002,d:5,sp:.00015,cs:1e5},'USDJPY':{n:'US Dollar vs Japanese Yen',p:150.2,v:.00022,d:3,sp:.012,cs:1000},'BTCUSD':{n:'Bitcoin vs US Dollar',p:67000,v:.0009,d:2,sp:15,cs:1},'US30':{n:'Dow Jones 30',p:42100,v:.0003,d:1,sp:2,cs:1}};
const TFS={M1:1,M2:2,M3:3,M4:4,M5:5,M6:6,M10:10,M12:12,M15:15,M20:20,M30:30,H1:60,H2:120,H3:180,H4:240,H6:360,H8:480,H12:720,D1:1440,W1:10080,MN:43200},TK=Object.fromEntries(Object.entries(TFS).map(([k,m])=>[k,Math.min(80,Math.round(3+Math.log2(m)*5))]));
const S={tab:'chart',sym:'XAUUSD.vx',tf:'H1',type:0,grid:1,ohlc:0,vol:0,bid:1,ask:1,last:0,note:1,dw:0,scheme:'Custom',col:{},adv:1,osound:1,oct:0,vibm:'Silent mode only',ring:'Default',adl:'Wi-Fi only',lock:0,pin:'',lang:'English',news:1,theme:'Dark',tabl:0,tfs:['M1','M5','M15','M30','H1','H4','D1','W1','MN'],sep:1,pos:1,ord:1,sltp:1,hist:1,ocPos:'Above chart',oc:1,cross:0,ind:{ema20:0,ema50:0,sma20:0,bb:0},filter:'All',lot:.01,adapter:'Simulated',conf:1,slip:10,sound:1,vib:1,syms:Object.keys(SY),endpoint:'',key:'',vis:60,off:0};
const SAVE=['sym','tf','type','grid','ohlc','vol','bid','ask','last','note','dw','v','scheme','tfs','col','adv','osound','oct','vibm','ring','adl','lock','pin','lang','news','theme','tabl','sep','pos','ord','sltp','hist','ocPos','oc','ind','filter','lot','adapter','conf','slip','sound','vib','syms','endpoint','key','vis'];
let ACC={bal:10000},POS=[],DL=[],ORD=[],P={},CD={},NT={},cx=null,cy=null,hv='POSITIONS',desc=1,edit=0,qsel=0;
/* ---------- IndexedDB ---------- */
let db;const idb=()=>new Promise(r=>{try{const q=indexedDB.open('mt5_web_terminal',1);q.onupgradeneeded=e=>{const d=e.target.result;['settings','account'].forEach(n=>d.createObjectStore(n));['positions','orders','deals'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}))};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const put=(s,v,k)=>{try{k===undefined?st(s,'readwrite').put(v):st(s,'readwrite').put(v,k)}catch(e){}};
const rm=(s,k)=>{try{st(s,'readwrite').delete(k)}catch(e){}};
const all=s=>new Promise(r=>{try{const q=st(s,'readonly').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}});
const get=(s,k)=>new Promise(r=>{try{const q=st(s,'readonly').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
let svT;const save=()=>{clearTimeout(svT);svT=setTimeout(()=>{const o={};SAVE.forEach(k=>o[k]=S[k]);put('settings',o,'state')},150)};
const saveAcc=()=>put('account',ACC,'acc');
/* ---------- Broker adapters ---------- */
function gauss(){return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(6.2832*Math.random())}
function step(s){const c=SY[s],q=P[s];let r=c.v*.35*gauss();if(Math.random()<.02)r+=c.v*(Math.random()-.5)*4;q.b*=Math.exp(r);q.hi=Math.max(q.hi,q.b);q.lo=Math.min(q.lo,q.b);q.t=Date.now()}
class BrokerAdapter{async connect(){throw Error('not implemented')}async placeOrder(o){throw Error('Broker not connected')}async closePosition(id,price){throw Error('Broker not connected')}getPrices(){return P}}
class SimulatedBroker extends BrokerAdapter{async connect(){return true}async placeOrder(o){return{...o,id:Math.floor(Date.now()/1000)%1e8*10+Math.floor(Math.random()*10),time:Date.now()}}async closePosition(id,price){return true}getPrices(){for(const s in SY)step(s);return P}}
class MetaApiBroker extends BrokerAdapter{/* TODO: MetaApi cloud REST/WebSocket */}
class CustomRESTBroker extends BrokerAdapter{/* TODO: custom REST (S.endpoint, S.key) */}
class CustomWebSocketBroker extends BrokerAdapter{/* TODO: custom WebSocket */}
const ADP={Simulated:SimulatedBroker,MetaApi:MetaApiBroker,CustomREST:CustomRESTBroker,CustomWebSocket:CustomWebSocketBroker};
let broker,bstat='Disconnected';
function reconnect(){broker=new ADP[S.adapter]();bstat='Connecting…';broker.connect().then(()=>{bstat='Connected';if(S.tab=='settings')rSet()}).catch(()=>{bstat='Disconnected (not implemented)';if(S.tab=='settings')rSet()})}
/* ---------- Candles ---------- */
const fm=(s,v)=>(+v).toFixed(SY[s].d);
function gen(s,tf){const c=SY[s],n=400,a=[],sg=c.v*.35*Math.sqrt(TK[tf])/Math.sqrt(8),m=TFS[tf]*6e4;let p=P[s].b*(1+(Math.random()-.5)*.02),t0=Math.floor(Date.now()/m)*m-(n-1)*m;
for(let i=0;i<n;i++){const o=p;let h=o,l=o;for(let j=0;j<8;j++){p*=Math.exp(sg*gauss());h=Math.max(h,p);l=Math.min(l,p)}a.push({t:t0+i*m,o,h,l,c:p,v:Math.round(50+Math.random()*200)})}
const k=P[s].b/p;a.forEach(x=>{x.o*=k;x.h*=k;x.l*=k;x.c*=k});return a}
const cands=()=>{const k=S.sym+'|'+S.tf;return CD[k]||(NT[k]=0,CD[k]=gen(S.sym,S.tf))};
function upCandles(){for(const k in CD){const[s,tf]=k.split('|'),b=P[s].b,a=CD[k],l=a[a.length-1];l.c=b;l.h=Math.max(l.h,b);l.l=Math.min(l.l,b);l.v++;if(++NT[k]>=TK[tf]){a.push({t:l.t+TFS[tf]*6e4,o:b,h:b,l:b,c:b,v:0});NT[k]=0;if(a.length>2000)a.shift();if(k==S.sym+'|'+S.tf&&S.off>0)S.off++}}}
const ema=(a,n)=>{const k=2/(n+1),o=[];a.forEach((x,i)=>o.push(i?x.c*k+o[i-1]*(1-k):x.c));return o};
const sma=(a,n)=>a.map((x,i)=>{if(i<n-1)return NaN;let s=0;for(let j=i-n+1;j<=i;j++)s+=a[j].c;return s/n});
const bbf=a=>{const m=sma(a,20),u=[],l=[];a.forEach((x,i)=>{if(i<19){u.push(NaN);l.push(NaN);return}let v=0;for(let j=i-19;j<=i;j++)v+=(a[j].c-m[i])**2;const d=2*Math.sqrt(v/20);u.push(m[i]+d);l.push(m[i]-d)});return{m,u,l}};
/* ---------- Chart drawing ---------- */
const cv=$('#cv'),g=cv.getContext('2d');let W=0,H=0;
function rs(){const r=$('#cw').getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;if(!W)return;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}
const p2=n=>String(n).padStart(2,'0'),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ft(t){const d=new Date(t);return S.tf=='MN'?MO[d.getMonth()]+' '+String(d.getFullYear()).slice(2):TFS[S.tf]>=1440?d.getDate()+' '+MO[d.getMonth()]:d.getDate()+' '+MO[d.getMonth()]+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function draw(){if(!W||S.tab!='chart')return;
const a=S.type==3?haf(cands()):cands(),sy=S.sym,d=SY[sy].d,PW=W-56,PH=H-18,vis=S.vis,bw=PW/vis,last=Math.min(a.length-1,a.length-1-S.off),xi=i=>PW-(last-i+12.5)*bw,lo=Math.max(0,last-Math.ceil(PW/bw)),hi=last;
let mn=1e18,mx=-1e18,vm=1;const bb=S.ind.bb?bbf(a):null;
for(let i=lo;i<=hi;i++){const c=a[i];mn=Math.min(mn,c.l);mx=Math.max(mx,c.h);vm=Math.max(vm,c.v);if(bb&&isFinite(bb.u[i])){mn=Math.min(mn,bb.l[i]);mx=Math.max(mx,bb.u[i])}}
const GN=Math.max(6,Math.round(PH/(W*.034))),pd=(mx-mn)*.08||1e-9;mn-=pd;mx+=pd;const y=p=>PH*(1-(p-mn)/(mx-mn));
g.fillStyle=C.bg;g.fillRect(0,0,W,H);g.font='10px Roboto,Arial,sans-serif';g.textBaseline='middle';
if(S.grid){g.strokeStyle=C.grid;g.lineWidth=1;g.setLineDash([2,3]);g.beginPath();for(let i=1;i<GN;i++){const yy=Math.round(PH*i/GN)+.5;g.moveTo(0,yy);g.lineTo(PW,yy)}const k=Math.max(1,Math.round(W*.133/bw));for(let i=lo;i<=hi;i++)if(i%k==0){const x=Math.round(xi(i))+.5;g.moveTo(x,0);g.lineTo(x,PH)}g.stroke();g.setLineDash([])}
if(S.sep){g.strokeStyle=C.sep;g.setLineDash([2,3]);g.beginPath();for(let i=lo+1;i<=hi;i++){const A=new Date(a[i-1].t),B=new Date(a[i].t),ch=TFS[S.tf]<1440?A.getDate()!=B.getDate():TFS[S.tf]<43200?A.getMonth()!=B.getMonth():A.getFullYear()!=B.getFullYear();if(ch){const x=Math.round(xi(i)-bw/2)+.5;g.moveTo(x,0);g.lineTo(x,PH)}}g.stroke();g.setLineDash([])}
if(S.vol){for(let i=lo;i<=hi;i++){const c=a[i],h=PH*.14*c.v/vm;g.fillStyle=C.volc+'88';g.fillRect(xi(i)-bw*.35,PH-h,Math.max(1,bw*.7),h)}}
